<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#1a2332"/>

  <!-- Outer gear teeth -->
  <g fill="#D4A574">
    <rect x="14" y="1" width="4" height="4" rx="0.5"/>
    <rect x="14" y="27" width="4" height="4" rx="0.5"/>
    <rect x="1" y="14" width="4" height="4" rx="0.5"/>
    <rect x="27" y="14" width="4" height="4" rx="0.5"/>
    <rect x="4.5" y="4.5" width="4" height="4" rx="0.5" transform="rotate(45 6.5 6.5)"/>
    <rect x="23.5" y="4.5" width="4" height="4" rx="0.5" transform="rotate(45 25.5 6.5)"/>
    <rect x="4.5" y="23.5" width="4" height="4" rx="0.5" transform="rotate(45 6.5 25.5)"/>
    <rect x="23.5" y="23.5" width="4" height="4" rx="0.5" transform="rotate(45 25.5 25.5)"/>
  </g>

  <!-- Gear body -->
  <circle cx="16" cy="16" r="10" fill="#D4A574"/>
  <circle cx="16" cy="16" r="7" fill="#1a2332"/>

  <!-- Center hexagon (engineering bolt) -->
  <polygon points="16,10 20.5,13 20.5,19 16,22 11.5,19 11.5,13" fill="#D4A574"/>
  <polygon points="16,12 18.5,14 18.5,18 16,20 13.5,18 13.5,14" fill="#1a2332"/>
</svg>

