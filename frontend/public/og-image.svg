<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a2332"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3342" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- Decorative gear (left) -->
  <g transform="translate(150, 315)" opacity="0.15">
    <circle r="120" fill="none" stroke="#D4A574" stroke-width="20"/>
    <circle r="60" fill="none" stroke="#D4A574" stroke-width="15"/>
  </g>

  <!-- Decorative gear (right) -->
  <g transform="translate(1050, 315)" opacity="0.15">
    <circle r="100" fill="none" stroke="#D4A574" stroke-width="15"/>
    <circle r="45" fill="none" stroke="#D4A574" stroke-width="12"/>
  </g>

  <!-- Main content area -->
  <g transform="translate(600, 280)">
    <!-- Logo gear icon -->
    <g transform="translate(0, -80)">
      <circle r="45" fill="#D4A574"/>
      <circle r="25" fill="#1a2332"/>
      <circle r="10" fill="#D4A574"/>
      <!-- Gear teeth -->
      <g fill="#D4A574">
        <rect x="-8" y="-60" width="16" height="15" rx="2"/>
        <rect x="-8" y="45" width="16" height="15" rx="2"/>
        <rect x="-60" y="-8" width="15" height="16" rx="2"/>
        <rect x="45" y="-8" width="15" height="16" rx="2"/>
      </g>
    </g>

    <!-- Site name -->
    <text y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">GM-TC</text>

    <!-- Tagline -->
    <text y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#D4A574">Engineering &amp; Innovation</text>

    <!-- Subtitle -->
    <text y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8a9aaa">CAD Design • Klipper Development • 3D Printing</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="400" y="580" width="400" height="4" rx="2" fill="#D4A574"/>
</svg>

